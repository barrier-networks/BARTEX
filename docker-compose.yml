services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barrier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-barrier}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barrier} -d ${POSTGRES_DB:-barrier}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  barrier:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: .
      args:
        BARRIER_VERSION: ${BARRIER_VERSION:-dev}
    image: barrier:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BARRIER_PG_DSN: postgres://${POSTGRES_USER:-barrier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-barrier}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BARRIER_LLM_PROVIDER: ${BARRIER_LLM_PROVIDER:-}
      BARRIER_LLM_MODEL: ${BARRIER_LLM_MODEL:-}
      BARRIER_LLM_BASE_URL: ${BARRIER_LLM_BASE_URL:-}
      BARRIER_LLM_PROXY: ${BARRIER_LLM_PROXY:-}
      BARRIER_JWT_KEY_DIR: /app/keys
      # Optional: key for secrets at rest; empty = keys/secret.key (generated at first start).
      BARRIER_SECRET_KEY: ${BARRIER_SECRET_KEY:-}
      BARRIER_TRUSTED_PROXIES: ${BARRIER_TRUSTED_PROXIES:-}
      # Untrusted-output boundary: on by default (empty = on); BARRIER_UNTRUSTED_BOUNDARY=0 in .env
      # disables it. Cost: about 154 bytes per tool result plus one system note.
      BARRIER_UNTRUSTED_BOUNDARY: ${BARRIER_UNTRUSTED_BOUNDARY:-}
      BARRIER_UPDATE_CHECK: ${BARRIER_UPDATE_CHECK:-}
      # Noise profile for target requests: off (default) | quiet | balanced | aggressive.
      BARRIER_NOISE_PROFILE: ${BARRIER_NOISE_PROFILE:-}
      BARRIER_TARGET_USER_AGENT: ${BARRIER_TARGET_USER_AGENT:-}
      # Hierarchical run budgets: unset or 0 = unlimited (no change). See README.
      BARRIER_TASK_BUDGET_TOKENS: ${BARRIER_TASK_BUDGET_TOKENS:-}
      BARRIER_TASK_BUDGET_TURNS: ${BARRIER_TASK_BUDGET_TURNS:-}
      BARRIER_INTENT_BUDGET_TOKENS: ${BARRIER_INTENT_BUDGET_TOKENS:-}
      BARRIER_INTENT_BUDGET_TURNS: ${BARRIER_INTENT_BUDGET_TURNS:-}
    ports:
      - "${BARRIER_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the runtime data directory (traffic index, task files, transcripts, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # JWT signing key and secret key (jwt.key, secret.key), kept out of data/, which the file manager browses.
      # Persisting it keeps users signed in across container rebuilds.
      - ./keys:/app/keys
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
