<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Centri">
  <title>Centri</title>
  <!-- Centri mark: a Cobalt-to-Deep gradient oval with a concentric outline pair
       (the native brand motif). Renders in gradient at full colour and as a clean
       white concentric-oval silhouette when inverted on a dark panel. -->
  <defs>
    <linearGradient id="centriGrad" x1="6" y1="14" x2="58" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A45A3"/>
      <stop offset="1" stop-color="#03122B"/>
    </linearGradient>
  </defs>
  <ellipse cx="32" cy="32" rx="29" ry="22" fill="none" stroke="#0A45A3" stroke-width="2.4"/>
  <ellipse cx="32" cy="32" rx="24.5" ry="18" fill="none" stroke="#0A45A3" stroke-width="2.4"/>
  <ellipse cx="32" cy="32" rx="17" ry="12" fill="url(#centriGrad)"/>
</svg>
